name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: build (windows-11-arm, win-arm64)
    # Free for public repositories only. The job fails on private repos.
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      APP_DIR: src/Armux.App/bin/ARM64/Release/net10.0-windows10.0.26100.0/win-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Assert native ARM64 runner
        run: |
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected an ARM64 runner" }

      - name: Test PE header validation (Pester 5)
        run: |
          if (-not (Get-Module -ListAvailable Pester |
              Where-Object { $_.Version -eq [version]'5.9.1' })) {
            Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 5.9.1 -ErrorAction Stop
          Invoke-Pester scripts -CI

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-arm64-${{ hashFiles('**/*.csproj', 'global.json') }}

      - name: Test core
        run: dotnet test --project tests/Armux.Core.Tests -c Release

      - name: Build app
        run: dotnet build src/Armux.App -c Release -p:Platform=ARM64

      - name: Publish app (NativeAOT)
        run: |
          # The AOT linker step locates MSVC through vswhere, which is not on PATH by default.
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"
          dotnet publish src/Armux.App -c Release -r win-arm64 -p:Platform=ARM64 -o publish
          dotnet publish src/Armux.Cli -c Release -r win-arm64 -o publish

      - name: Verify PE machine type is 0xAA64
        # The shipped binaries. (The publish step rebuilds bin/ self-contained, so the JIT build's exe is gone by now.)
        run: ./scripts/check-pe-arm64.ps1 publish/armux.exe publish/armux.com

      - uses: actions/upload-artifact@v7
        with:
          name: armux-win-arm64
          path: publish
          if-no-files-found: error
          retention-days: 14
